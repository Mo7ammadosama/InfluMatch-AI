version: "3.9"
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file: influmatch/.env
    volumes:
      - ./influmatch/data:/app/data
      - ./influmatch/logs:/app/logs
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    env_file: influmatch/.env
    depends_on:
      - backend
    restart: unless-stopped
